services:
  api:
    build:
      context: ./automation-platform
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=automation_platform;Username=postgres;Password=1234
      Discord__WebhookUrl: ${DISCORD_WEBHOOK_URL}
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: automation_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: